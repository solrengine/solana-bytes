  about:
    title: Acerca de
    what_title: Qué es
    what_p1: Solana Bytes es un visualizador hex interactivo de cuentas de Solana combinado con un juego, el Byte Challenge.
    what_p2: Pega cualquier dirección de cuenta para ver los metadatos decodificados y los bytes en bruto con tooltips al pasar el ratón sobre cada campo. Juega al Challenge para poner a prueba tu conocimiento de las estructuras de datos de Solana — encuentra campos concretos en volcados hex, encadena rachas, sube en la clasificación.
    why_title: Por qué existe
    why_p1_html: Los exploradores actuales de Solana son geniales para las transacciones pero tratan los datos de cuenta en bruto como un blob opaco. Si quieres entender qué <em>es</em> realmente una cuenta Stake, una cuenta Vote o una cuenta Metadata de Metaplex a nivel de byte, te toca leer el código fuente.
    why_p2: Solana Bytes es la guía a nivel de byte que nos hubiera gustado tener al aprender — un único lugar para inspeccionar, decodificar y practicar con los diseños que todo desarrollador de Solana acaba tocando.
    who_title: Quién lo construyó
    who_p1_html: 'Creado para el <strong class="text-purple-300">Colosseum Frontier Hackathon</strong> por <a href="https://moviendo.me" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">Jose Ferrer</a>, creador de <a href="https://solrengine.org" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">SolRengine</a> — un motor de Rails de código abierto para auth de billetera, RPC y decodificación de cuentas de Solana.'
    who_p2: 'Solana Bytes es la aplicación de referencia que demuestra el motor de principio a fin: inicio de sesión con billetera, obtención por RPC con reintentos, decodificación de cuentas por programa y un bucle de juego real encima.'
    who_p3_html: 'Inspirado en la serie de YouTube <a href="https://www.youtube.com/solandy" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">Learn Solana in 2026</a> de <a href="https://x.com/HeyAndyS" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">Solandy</a> — el recorrido a nivel de byte que hizo que los diseños de cuentas de Solana parecieran accesibles.'
