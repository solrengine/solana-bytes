  about:
    title: About
    what_title: What it is
    what_p1: Solana Bytes is an interactive hex visualizer for Solana accounts paired with a Byte Challenge game.
    what_p2: Paste any account address to see decoded metadata and raw bytes with hover tooltips for every field. Play the Challenge to test your knowledge of Solana data structures — find specific fields in hex dumps, build streaks, climb the leaderboard.
    why_title: Why it exists
    why_p1_html: Solana’s existing explorers are great for transactions but treat raw account data as an opaque blob. If you want to understand what a Stake account, a Vote account, or a Metaplex Metadata account actually <em>is</em> at the byte level, you read the source.
    why_p2: Solana Bytes is the byte-level guide that we wanted when we were learning — one place to inspect, decode, and practice on the layouts that every Solana developer eventually touches.
    who_title: Who built it
    who_p1_html: 'Built for the <strong class="text-purple-300">Colosseum Frontier Hackathon</strong> by <a href="https://moviendo.me" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">Jose Ferrer</a>, creator of <a href="https://solrengine.org" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">SolRengine</a> — an open-source Rails engine for Solana wallet auth, RPC, and account decoding.'
    who_p2: 'Solana Bytes is the reference application that demonstrates the engine end-to-end: wallet sign-in, RPC fetching with retry, per-program account decoding, and a real game loop on top.'
    who_p3_html: 'Inspired by <a href="https://x.com/HeyAndyS" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">Solandy</a>’s <a href="https://www.youtube.com/solandy" class="text-purple-400 hover:text-purple-300" target="_blank" rel="noopener">Learn Solana in 2026</a> YouTube series — the byte-level walkthrough that made Solana account layouts feel approachable.'
